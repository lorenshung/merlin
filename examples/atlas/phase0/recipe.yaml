# Deterministic Phase 0 inputs. Capsule membership is generated from the
# selected facts, software spec and independent iteration captures.
software_spec: ../target/software-spec.yaml
capsule_policy: derived_only
datapath:
  semantic_defaults: {must_accelerate: true}
  compare: tolerance_float
  atol: 0.25
  rtol: 0.02
  subnormal_operand_flush: true
  required_oracle_tiers: [L0, L1, L2, L3]
capsules: []
