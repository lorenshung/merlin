# How a whole-model program is RUN on each machine this target measures on (the
# whole_model_measured mode's machine registry). WHICH DEVICE each one is stays the pin
# registry's (merlin/contract/hardware_pins.yaml), resolved by content before any cycle.
# Host locations are environment references, never paths written here.
schema: merlin.phase2.whole_model_measured.machines.v1
target: gemmini
machines:
  # Preferred full Gemmini/Rocket U250 design. Its queue name resolves to the
  # FireSimGemminiRocketConfig bitstream pinned by content in hardware_pins.yaml.
  full_u250_board:
    kind: firesim
    hw_config: alveo_u250_firesim_gemmini_rocket_30mhz
    chipyard: {env: MERLIN_CHIPYARD_GEMMINI_ROCKET}
    workload: merlin-phase2-wholemodel
    bootbinary: wholemodel-baremetal
    queue_command: [env, -u, HOME, -u, USER, -u, LOGNAME, firesim-queue]
    jobs_root: {env: MERLIN_FIRESIM_QUEUE_JOBS}
    uart_relative: simulation/sim_slot_0/uartlog
    submit_arguments: [--timeout, "3600", --priority, "10"]
    program_header_sha256: "3758ae967af3a179497660970201093a7fb624be00173990ce33d3f5c38da924"
    lock_path: {env: TMPDIR, join: merlin_firesim.lock}
    poll_seconds: 20.0
    adjudicates: [cycle_count]
  # Retained for comparing historical Lean runs only. This bitstream has no
  # full-width accumulator readout; never treat it as the full design above.
  lean_u250_board:
    kind: firesim
    hw_config: alveo_u250_firesim_gemmini_rocket_singlecore_no_nic
    chipyard: {env: MERLIN_EXT_CHIPYARD}
    workload: merlin-phase2-wholemodel
    bootbinary: wholemodel-baremetal
    # The queue daemon runs as another user: the submitter's identity must not reach it.
    queue_command: [env, -u, HOME, -u, USER, -u, LOGNAME, firesim-queue]
    jobs_root: {env: MERLIN_FIRESIM_QUEUE_JOBS}
    uart_relative: simulation/sim_slot_0/uartlog
    submit_arguments: [--timeout, "3600", --priority, "10"]
    program_header_sha256: "5bfbb7263e3db079ead66f1c8b1a7224d9764dd4025e8c91d4f9c65204990ec0"
    lock_path: {env: TMPDIR, join: merlin_firesim.lock}
    poll_seconds: 20.0
    adjudicates: [cycle_count]
    cannot_express:
      - output_element_bytes: 4
        compare: exact
        reason: no full-width accumulator readout on this bitstream (acc_read_full_width=false)
  # The functional model grades every group locally, in parallel with the board.
  functional_model:
    kind: spike
    command:
      - {env: MERLIN_CHIPYARD_GEMMINI_ROCKET, join: .conda-env/riscv-tools/bin/spike}
      - --extension=gemmini
    environment:
      LD_LIBRARY_PATH: {env: MERLIN_CHIPYARD_GEMMINI_ROCKET, join: .conda-env/riscv-tools/lib}
    identity_files:
      - {env: MERLIN_CHIPYARD_GEMMINI_ROCKET, join: .conda-env/riscv-tools/lib/libgemmini.so}
    adjudicates: [correctness]
  paired_board:
    kind: paired
    timing: full_u250_board
    local: functional_model
    timing_verify: words
  # Several candidates per board job, the vendor reference as the in-batch control.
  batched_board:
    kind: batched
    timing: full_u250_board
    local: functional_model
    timing_verify: words
    batch_size: 8
    batch_wait_seconds: 240
  # The certifier: the elaborated-RTL emulator, graded from its memory dump.
  gsim_certifier:
    kind: contract
    measurer: merlin.perf.whole_model_gsim:measure
    registry_machine: gemmini_gsim_emulator
    adjudicates: [correctness]
