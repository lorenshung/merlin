schema_version: 1
id: gemmini-core-aten-functional
target: gemmini
description: Continuous EL4 compiler authoring on public Core ATen single-op capsules and a private bounded-suite cohort.
inputs:
  target: target/descriptor.yaml
policy:
  prohibited_instruction_roles: [loop_descriptor]
phases:
  1:
    adapter: capsule_bench
    config:
      require_reviewed_corpus: true
      descriptor: target/descriptor.yaml
      level: EL4
      bundle: merlin_assisted_rtlchecks_public_v0
      # Preparation must generate this bundle inside the selected release.
      # Select that release's private/seal.json and matching manifest together on the CLI.
      bundle_manifest: ../../../out/artifacts/probes/phase1-prep/gemmini-def/release/payload/experiment/input_bundles/merlin_assisted_rtlchecks_public_v0/input_bundle_manifest.yaml
      oracle_timing: ../../../out/artifacts/probes/phase1-prep/gemmini-def/oracle/.oracle_timing.gemmini.json
      driver: codex
      model: gpt-6.1-sol
      effort: high
      provider: subscription
      max_wall_s: 43200
      round_timeout: 43200
      grade_interval: 900
      sim_max_jobs: 5
