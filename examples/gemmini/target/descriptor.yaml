# Experiment resources and workload policy; hardware facts are extracted inputs.
# See ../phase0/README.md for deterministic derivation and evidence selection.
target: gemmini
resources_root: merlin/experiments/capsule_bench/targets/gemmini
task_root: examples/gemmini/phase1/task
contracts_root: examples/gemmini/phase1/contracts
numeric_profile: examples/gemmini/phase0/recipe.yaml

rtl:
  via: mlc            # RTL facts are DERIVED from mlc discovery (MERLIN_MLC_DIR, the target above)

hardware_spec:
  isa_headers:
    - experiments/capsule_bench/targets/gemmini/contracts/hwbringup_gemmini_v0/isa_include/gemmini.h
    - experiments/capsule_bench/targets/gemmini/contracts/hwbringup_gemmini_v0/isa_include/gemmini_params.h
  hwbringup_set: experiments/capsule_bench/targets/gemmini/contracts/hwbringup_gemmini_v0
  curated_harness: contracts/harness_curated/gemmini-rocc-tests

capsule_corpus: merlin/contract/capsules/isa

grading:
  release_admission: derive_from_corpus_v1
  resource_bound:
    policy: representative_l3_capstones_v1
    exclude_capsules:
      - GX0_interop_rvv_lane
      - M0_small_llama_gemmini
      - M1_lstmnetvit_gemmini
      - SY_model_resnet50
      - SY_model_tiny_llama
      - SY_model_smolvla
      - M4_smolvla_denoise_gemmini
    required_admitted_models:
      - M2_microvit_gemmini
      - M3_host_island_seam_gemmini
      - SY_micro_model

answer_surfaces:
  prior_backends: [merlin_native_v0, hand_smoke_oot, agent_spec_v0_mlir_oot, agent_spec_v1_mlir_oot]
  prior_backend_exemptions: []

performance:
  global_objective_capsule: M2_microvit_gemmini

toolchain:
  sim_via: chipyard

oracle_resources:
  L5:
    exclusive_resource: firesim_fpga_queue
    batched: true
    queue_wall_limit_s: 43200

host:
  board: chipyard_kodiak

workload_spec:
  models: [resnet50, tiny_llama, smolvla]
  applications:
    - coverage_mlp
    - residual_cnn
    - causal_decoder
    - multimodal_policy
  historical_application_suites:
    model_scale: [deepjscc_int8_consistent, lstmnetvit_fp8_consistent,
                  lstmnetvit_int8_consistent, lstmnetvit_int8_w8a8_consistent]
  cert_budget_s: 300
  precision_preference: [int8, fp8_e4m3, mxfp8, fp16, bf16, fp32]
  max_synthesized_capsules: 160

host_lane:
  capability_spec: examples/gemmini/target/host-capabilities.yaml
  description: >-
    Candidate int8 RVV host lane for operations not admitted to Gemmini. The selected
    capability manifest is unreviewed; normalization, reduction and activation tails
    require exact per-operation lowering and numerical receipts before any partitioned
    model may claim a verified host fallback. The experiment selects
    dtype_strategy=int8_w8a8; that selection alone does not establish host support.
  repo_canonical: https://github.com/ucb-bar/rvv-mlir.git
  dtype_strategy: int8_w8a8
  provenance: in_tree_minted
  package: out/artifacts/targets/rvv/impr_tuned_wholemodel_vf_int8
  requires_paths:
    - manifest.yaml
    - schedule.mlir
    - knobs.yaml
  read_only:
    - out/artifacts/targets/rvv/impr_tuned_wholemodel_vf_int8/
  deny_modification:
    - merlin/python/merlin/llvmlower/
