# Experiment resources and workload policy; hardware facts are extracted inputs.
# See ../phase0/README.md for deterministic derivation and evidence selection.
target: gemmini
resources_root: merlin/experiments/capsule_bench/targets/gemmini
task_root: examples/gemmini/phase1/task
contracts_root: examples/gemmini/phase1/contracts
numeric_profile: examples/gemmini/phase0/recipe.yaml

rtl:
  via: mlc            # RTL facts are DERIVED from mlc discovery (MERLIN_MLC_DIR, the target above)

hardware_spec:
  isa_headers:
    - experiments/capsule_bench/targets/gemmini/contracts/hwbringup_gemmini_v0/isa_include/gemmini.h
    - experiments/capsule_bench/targets/gemmini/contracts/hwbringup_gemmini_v0/isa_include/gemmini_params.h
  hwbringup_set: experiments/capsule_bench/targets/gemmini/contracts/hwbringup_gemmini_v0
  curated_harness: contracts/harness_curated/gemmini-rocc-tests

capsule_corpus: merlin/contract/capsules/isa

grading:
  release_admission: derive_from_corpus_v1
  resource_bound:
    policy: representative_l3_capstones_v1
    # Derived at release preparation from the staged corpus: every whole-model capsule Phase 0
    # generated and admitted (an integer model only with its model_qualification) is a required
    # capstone; any other public model is excluded by name. No hand-maintained model list.
    derive: phase0_qualified_models_v1

answer_surfaces:
  prior_backends: [merlin_native_v0, hand_smoke_oot, agent_spec_v0_mlir_oot, agent_spec_v1_mlir_oot]
  prior_backend_exemptions: []

performance:
  global_objective_capsule: M2_microvit_gemmini

toolchain:
  sim_via: chipyard

oracle_resources:
  L5:
    exclusive_resource: firesim_fpga_queue
    batched: true
    queue_wall_limit_s: 43200

host:
  board: gemmini_rocket_verilator
  catalog: examples/gemmini/target/board-catalog.yaml

workload_spec:
  models: [resnet50, tiny_llama, smolvla]
  # OBJECTIVE VARIANTS of a claim model: the same network captured with a capture capability
  # (`quant_activation_contractions` integerizes the activation x activation contractions,
  # `quant_integer_nonlinear` adds integer softmax / GELU / layer norm). Each is a different numerical
  # model the owner measures after the Phase-1 freeze, exactly like the claim model it names; none is
  # a derivation source. Equivalent forms for derivation come from the `multimodal_policy` application.
  claim_objective_variants:
    smolvla:
      int8attn:
        quant_scheme: int8_dyn_act_int8_weight
        quant_activation_contractions: true
      int8full:
        quant_scheme: int8_dyn_act_int8_weight
        quant_activation_contractions: true
        quant_integer_nonlinear: true
  applications:
    - coverage_mlp
    - residual_cnn
    - causal_decoder
    - multimodal_policy
  historical_application_suites:
    model_scale: [deepjscc_int8_consistent, lstmnetvit_fp8_consistent,
                  lstmnetvit_int8_consistent, lstmnetvit_int8_w8a8_consistent]
  cert_budget_s: 300
  precision_preference: [int8, fp8_e4m3, mxfp8, fp16, bf16, fp32]
  max_synthesized_capsules: 160

host_lane:
  capability_spec: examples/gemmini/target/host-capabilities.yaml
  # Both selected GemminiRocketConfig and FireSimGemminiRocketConfig DTS files
  # declare this ISA (with no V). resolve_host_lane checks the package march.
  host_isa: rv64imafdcbzicsr_zifencei_zihpm_zfh_zba_zbb_zbs_xrocket
  description: >-
    Generated scalar int8 package for the non-vector Rocket host. The package
    ISA fits the selected DTS; a saved dequantization capture passed Spike.
    These are not Rocket RTL/FireSim execution or blanket host-operation
    qualifications. Each claimed host route still needs its own emitted
    lowering and numerical checks before a partitioned model can pass.
  repo_canonical: https://github.com/ucb-bar/merlin.git
  dtype_strategy: int8_w8a8
  provenance: in_tree_minted
  package: out/artifacts/targets/host/gemmini_rocket_scalar_int8_v0
  requires_paths:
    - manifest.yaml
    - knobs.yaml
  read_only:
    - out/artifacts/targets/host/gemmini_rocket_scalar_int8_v0/
  deny_modification:
    - merlin/python/merlin/llvmlower/
