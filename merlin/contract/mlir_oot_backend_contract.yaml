# Out-of-tree MLIR backend contract (experiment ABI v0.1)
# The artifact a package IS, the four required CLI entrypoints, and the optional one-pass analysis
# entrypoint the runner may invoke (subprocess only).
version: "0.1"
artifact_type: mlir_oot_target_backend

manifest:
  file: manifest.yaml
  schema: schemas/manifest.schema.json
  required: [artifact_type, target, language, authoring, integrity_exempt, entrypoints, commands]

llvm_pin:
  # C++ packages build a real out-of-tree {target}-opt against this exact LLVM/MLIR.
  version: "23.0.0git"
  commit: "a47bddccec30"
  source: third_party/llvm-project
  install: third_party/llvm-install            # override with MERLIN_MLIR_INSTALL
  cmake: "find_package(MLIR REQUIRED CONFIG) with MLIR_DIR=$install/lib/cmake/mlir"
  rv64_compiler: clang-23 (MERLIN_CLANG)        # same LLVM 23; .ll -> rv64 object

argv_templates:
  # placeholders the runner substitutes: {tool} {input_mlir} {output_json}
  notes: "{tool} resolves to entrypoints.tool inside the package (or build.tool_output if built)."

entrypoints:
  parse:
    purpose: "parse + verify the interface.mlir; nonzero exit on diagnostics"
    example_argv: ["{tool}", "--verify-diagnostics", "{input_mlir}"]
    output: "exit code (0 = ok)"
  lower_interface_to_target:
    purpose: "merlin_iface -> target dialect MLIR"
    example_argv: ["{tool}", "--convert-iface-to-{target}", "{input_mlir}"]
    output: "target MLIR on stdout"
  emit_command_buffer:
    purpose: "interface -> command_buffer.json"
    example_argv: ["{tool}", "--convert-iface-to-{target}", "--emit-command-buffer={output_json}", "{input_mlir}"]
    output: "writes {output_json} (schema-valid command buffer)"
  # Canonical alias: emit_target_artifact (the runner accepts EITHER name). The 4th entrypoint emits the
  # target's codegen ARTIFACT, whose kind is the target's endpoint_kind: inline_asm_insn -> an LLVM-dialect
  # module of raw .insn on STOCK LLVM (command-ISA targets); external_backend -> a device kernel source
  # (SIMT/GPU); upstream_target -> lowering to an upstream LLVM target. Not LLVM-specific.
  lower_target_to_llvm:
    purpose: "target dialect -> the target's codegen artifact (per endpoint_kind; not necessarily LLVM)"
    example_argv: ["{tool}", "--convert-iface-to-{target}", "--emit-target-artifact", "{input_mlir}"]
    output: "the target artifact on stdout (its kind is decided by the target's endpoint_kind)"
  emit_analysis_bundle:
    required: false
    purpose: "optional one-pass whole-model analysis: emit both independently required artifacts"
    example_argv: ["{tool}", "--convert-iface-to-{target}", "--emit-command-buffer={output_json}", "--emit-target-artifact", "{input_mlir}"]
    output: "writes the command buffer to {output_json} and the target artifact to stdout"
    fallback: "when absent, the runner invokes emit_command_buffer and lower_target_to_llvm separately"

kernel_abi:
  # The lowered LLVM module MUST define this entry the runner-owned harness calls. The harness
  # embeds the deterministic leaf tensors (by name) and the output buffers, then prints
  # OUT/METRIC/DONE. The package only emits the kernel; the harness + link are the runner's.
  symbol: "{target}_kernel"
  # THE POINTER LIST DEPENDS ON THE COMMAND SHAPE. There is not one argument order; there are three,
  # and `arg_order_by_command_shape` below is the single source of truth for all of them. It used to
  # say only the resident-matmul one, and the whole-op harness had quietly grown a different rule: a
  # native CONV2D is called in the interface's DECLARATION order, so the four shipped conv capsules
  # that declare the activation before the weight (`IFM, W, Y0`) were compiled weight-first against a
  # harness that passed activation-first. The kernel then gathered activations out of the weight
  # buffer and MVIN'd the weight with the activation's pitch. Four functional failures, one
  # undocumented rule. Read the row whose `when` matches your buffer and no other.
  # The resident_matmul shape's signature, kept concrete and first because single-shape readers
  # consume this key. The other two shapes have a DIFFERENT arity and order.
  signature: "void {target}_kernel(ptr weight_0 .. ptr weight_{G-1}, ptr lhs_0 .. ptr lhs_{R-1}, ptr out_0 .. ptr out_{R-1}) - the resident_matmul command shape ONLY; other shapes: arg_order_by_command_shape[].signature"
  # Kept as a flat string because readers that implement only the resident-matmul shape consume this
  # key (merlin.llvmlower.device_shim.kernel_abi_for renders it into the emitted shim). It is the
  # resident_matmul row restated and MUST NOT be read as the rule for any other shape.
  arg_order: "resident_matmul shape ONLY: [each group's resident weight, in resident-pack order] ++ [every group's matmul lhs, group-major] ++ [every group's commit output, group-major] ++ [the bias of every commit declaring a fused bias stage, group-major -- empty when none does]. Other command shapes have a DIFFERENT order: see arg_order_by_command_shape."
  # Rows are tried TOP-DOWN and the FIRST matching `when` decides the ABI; this mirrors the dispatch a
  # runner-owned harness renderer performs, so a buffer that could match two rows is answered by the
  # earlier one. `order` is the machine-checkable form: a list of tokens from `arg_order_tokens`, each
  # expanding to zero or more pointer arguments, concatenated left to right. The prose and the token
  # list say the same thing; `build_tools/scripts/check_kernel_abi_arg_order.py` renders each target's
  # real harness for a probe buffer of every shape and fails if the emitted call disagrees with the
  # tokens, so this document cannot drift from the code again.
  arg_order_by_command_shape:
    - shape: whole_program
      when: "the buffer explicitly declares kernel_abi.kind = whole_program; this row is first, so an
             explicit whole-program pointer boundary takes precedence over inference from its accelerator
             command subset"
      kernel_abi_kind: whole_program
      signature: "void {target}_kernel(ptr arg_0 .. ptr arg_{N-1})"
      order: [declared_whole_program_args]
      prose: "kernel_abi.args[].tensor in declaration order. Every declared tensor buffer appears exactly
              once; access declares allocation/materialization only, and outputs must exactly equal the
              tensors whose role is output. The runner performs no model operation."
    - shape: movement
      when: "the buffer has NO RES_PACK command and at least one MOVEMENT (or an identity-combine VECTOR_MAP)"
      signature: "void {target}_kernel(ptr src, ptr dst)"
      order: [movement_src, movement_dst]
      prose: "[the movement source] ++ [the movement destination]"
    - shape: native_whole_op
      when: "the buffer contains EXACTLY ONE whole-op command, whose opcode is one of `opcodes` below"
      opcodes: [ATTENTION_QK, ATTENTION_PV, BATCHED_MATMUL, CONV2D]
      signature: "void {target}_kernel(ptr t_0 .. ptr t_{N-1})"
      order: [interface_external_tensors_in_declaration_order]
      prose: "the interface's OWN external tensors (role input | weight | bias | output) in DECLARATION
              order - NOT weight-first, and NOT operand-role order. A conv declaring `IFM, W, Y0` is
              called `(IFM, W, Y0)`; the same conv declaring `W, IFM, Y0` is called `(W, IFM, Y0)`.
              Batched matmul likewise preserves its interface declaration order and logical result rank.
              A whole-op artifact receives neither a reordered weight nor a codegen-only derived buffer,
              so an im2col matrix is an internal lowering detail and never a pointer argument."
    - shape: resident_matmul
      when: "otherwise - the RES_PACK / MATMUL(_RESIDENT) / COMMIT form, including a CONV2D the package
             itself lowers to that form (its derived im2col lhs then IS a pointer argument)"
      signature: "void {target}_kernel(ptr weight_0 .. ptr weight_{G-1}, ptr lhs_0 .. ptr lhs_{R-1}, ptr out_0 .. ptr out_{R-1}, ptr bias_0 .. ptr bias_{B-1})"
      order: [resident_weights_in_resident_pack_order, matmul_lhs_group_major, commit_outputs_group_major,
              commit_biases_group_major]
      prose: "up to four contiguous blocks: [each resident weight, in resident-pack (first-use) order] ++
              [every matmul lhs] ++ [every commit output] ++ [the bias operand of every commit that
              declares a fused bias epilogue stage]. Within the per-matmul blocks the order is
              GROUP-MAJOR: all of the first weight's matmuls in command order, then the second weight's.
              With one resident weight - the common case - this is weight, lhs..., out.... The bias block
              is LAST and is EMPTY unless a commit declares a bias stage, so a buffer without one has
              exactly the three-block signature it always had."
  # The token vocabulary the `order` lists are written in. One token, one resolution rule, resolved
  # against the command buffer; a token nobody can resolve is a REFUSAL, never a guessed position.
  arg_order_tokens:
    declared_whole_program_args: "kernel_abi.args[].tensor in array order, only when kernel_abi.kind is
      whole_program; each arg also declares read|write|readwrite access, every tensors entry appears
      exactly once, and kernel_abi.outputs equals exactly the role=output tensors"
    movement_src: "the MOVEMENT/identity-VECTOR_MAP command's `src` (or `lhs`) operand"
    movement_dst: "that command's `dst` operand"
    interface_external_tensors_in_declaration_order: "every tensor in `tensors` whose role is input,
      weight, bias or output, in the order the interface declared it (the command buffer preserves
      declaration order as `tensors` insertion order). Resident handles are NOT external tensors."
    resident_weights_in_resident_pack_order: "for each RES_PACK, its `src`, de-duplicated, in command order"
    matmul_lhs_group_major: "each matmul's `lhs`, grouped by the resident weight its `rhs` resolves to,
      groups in resident-pack order, commands in buffer order within a group"
    commit_outputs_group_major: "the `dst` of the COMMIT that consumes each matmul's accumulator, in the
      same group-major order as matmul_lhs_group_major"
    commit_biases_group_major: "the bias tensor named by each COMMIT that declares a bias epilogue
      stage (`bias_add`/`bias`), in the same group-major order as matmul_lhs_group_major. A commit
      with no bias stage contributes NOTHING, so this token expands to the empty list for every
      buffer that declares no fused bias. The name is read from the commit's `attributes.bias` or
      its `operands.bias` (both are legitimate; a stage that names neither is a REFUSAL, never a
      skipped argument). The pointee is in the ACCUMULATOR's dtype, not the operand dtype."
  pointee_layout: >-
    Use the declared tensor ABI and selected target's derived geometry, padding and
    readout format. Logical whole-program buffers and device-packed tile buffers
    are distinct layouts; never assume a fixed tile edge or element precision.
  selected_host_toolchain: >-
    For a whole-program kernel with a host lane, read the selected read-only host package's
    knobs.yaml cflags. Its -march and -mabi are the host object ISA and calling convention;
    the emitted LLVM module, runner-owned harness, selected board/DTS and linker must agree.
    Do not infer these flags from the accelerator name, substitute the build machine's ISA,
    or implement a second host runtime. The runner owns the harness, link and execution;
    a package's emitted code must obey the declared pointer ABI above.

whole_program_attribution:
  public_plan_schema: "merlin/contract/schemas/mixed_program_plan.schema.json"
  public_preflight: >-
    The granted xDSL kit exposes python -m merlin.targetgen.oot_starterkit.plan inventory
    --source <capsule.interface.mlir> and validate --source <capsule.interface.mlir>
    --command-buffer <command_buffer.json> --lowered-mlir <lowered.mlir>. The inventory
    hashes exact UTF-8 source bytes and indexes every direct operation in the unique
    source function's entry block
    except func.return, including constants, tensor.empty, tensor.splat and linalg.fill;
    it does not index nested scalar-body operations. The payload-only linalg reader's op
    indices are NOT source_op_indices. Validation checks schema, source/task/range/tensor
    bindings and lowered task tags only; it is not numerical or execution evidence.
  source_to_task: >-
    Preserve each source operation's stable prov.region_id where present while lowering. In
    params.global_program_plan (schema mixed_program_plan_v1), tasks enumerate actual
    emission order with unique, contiguous nonnegative task_index values, nonempty kind,
    and source_op_indices referring to the full source function's operation order. Bind
    source_sha256 and source_op_count to the public inventory. Include the scheduled
    instruction count, wrapper ranges, task instruction ranges, reads/writes,
    entry_bindings, source_values, output_bindings and compiler_temporaries specified
    by the typed schema; every materialized tensor needs source or temporary provenance.
    The source_op_indices must cover each source operation exactly once; derive any
    source-region-to-task/group map from those indices and the source IR, including
    repeated operations in one region. Do not invent a region ID from a capsule name,
    opcode count or output shape. A group may contain several source operations, but
    it may not hide an unassigned or duplicated source operation.
  lowered_ir_task: >-
    Carry the same task_index into the lowered LLVM-dialect IR as the
    merlin.global_task attribute on operations owned by that task, including host
    arithmetic. Keep this identity consistent with params.global_program_plan.tasks;
    untagged arithmetic or a tag naming no planned task is not attributable host work.
    The plan's kind describes the proposed host/device route; it does not prove that
    the device executed it.
  device_command_source: >-
    Attribute device work to its source operation using merlin.source_op_index and
    the source's prov.region_id. A region ID can be shared by several source operations;
    a shared ID alone cannot establish that every operation ran. A fused command may
    implement several source operations only with independently checked transformation
    evidence; no command count, region tag or candidate declaration supplies that proof.
  host_compute_boundary: >-
    In an accepted device task, scalar addressing, loop control and dispatch are
    legitimate host instructions; arithmetic on tensor elements is not. Helper
    functions remain inside the same audit boundary. Explicit host tasks may
    compute only independently ineligible work; moving eligible source operations
    into host tasks does not waive accelerator placement. Missing or opaque
    computation ownership remains unverified, never implicitly clean.
  independent_proof: >-
    These are candidate declarations, not certification. The independent grader
    checks source and emitted-IR identity, complete source/task coverage, selected
    target legality, numerical outputs and a completed source-region-to-dispatch
    ledger. Static placement, task tags, command or opcode counts, and a linked ELF
    alone cannot establish accelerator execution or correctness.

build:
  optional: true
  purpose: "C++ packages declare a build block; the runner builds before first use"
  fields: {configure: "[argv]", command: "[argv]", tool_output: "relative path to built tool"}

# The ADMISSION PARTITION. A package handed a program must land in exactly ONE route and must SAY
# which; the routes are disjoint and together they cover every well-formed input. Enforced by
# `build_tools/scripts/check_route_partition.py` over `merlin.runtime.route_partition`.
#
# This section exists because its absence was load-bearing. Nothing here required a decline, and
# `validate_command_buffer` only ever read `declined` as an EXCUSE (it lets such a buffer skip the
# operands-reference-a-tensor check). So a package that emitted nothing and said nothing was
# contract-conformant, and no grader could tell it apart from one that correctly declined. Measured
# 2026-09-07 across `out/runs`: 244 buffers empty with no decline, and 30 that decline an opcode and
# then emit it anyway. Three cases were reproduced from a spec in one command each -- an `rmsnorm`,
# a forbidden direct-scratchpad op and a stateful random op -- each exiting 0 with empty stderr and
# the program's declared OUTPUT TENSOR silently absent from the buffer.
admission:
  routes:
    A: "accepted -- the buffer emits target work for the admitted region"
    H: "an explicit host or composed route; the seam is declared and checked separately"
    D: "an explicit decline -- no target command, no target-visible effect, and a stated reason"
  obligations:
    exactly_one_route: "every well-formed input lands in exactly one of A, H, D"
    disjoint: "a buffer may not both decline and emit. A consumer reading `declined` excuses the case
      while a consumer reading `commands` executes it, so a buffer doing both simultaneously grades as
      declined AND runs"
    decline_is_explicit: "an empty `commands` list plus a zero exit code is NOT a decline. A decline
      declares a `declined` object; absent that, an empty buffer is indistinguishable from a program
      dropped on the floor and reported as success"
    decline_states_a_reason: "`declined.reason` is required and must be readable by whoever has to act
      on it. `declined.op` names the operation that was not lowered, when one operation is responsible"
    no_silent_host_loss: "a decline may not drop a declared output. If the interface program commits an
      output, declining means saying so -- never omitting the tensor and exiting 0"
    unsupported_is_not_a_fourth_route: "a checker's or compiler's own out-of-model disposition must
      resolve to H or D. It may never resolve to A, and it may never be left unstated"
    host_route_states_a_reason_the_target_does_not_contradict: "a region placed on a host lane is a
      refusal, and it must say why in `params.lane_placement[].reason`. The reason must not be
      contradicted by the target's OWN derived capability: if the target's readout facet
      (`merlin.targetgen.readout_facet`) licenses the epilogue stage the family needs, then `family X
      has no datapath here` is false and the region was refused for a reason the hardware denies.
      Measured on a deployable ResNet-50 package: 116 of 119 host-routed regions state a no-datapath
      reason while the target's own backend declares a readout applying acc_scale, relu and maxpool.
      Fix the lowering or state the real reason -- a declaration gap is not a hardware limit.
      Adjudicated by `merlin.runtime.route_quality.declaration_quality`, gate
      `route_declaration_quality`"
    accepted_region_does_not_compute_on_the_host: "a region routed A may configure, address and
      synchronize on the host, but it may not COMPUTE there. An arithmetic operation in the region's
      host IR whose operand chain reaches a load from a tensor buffer (a `kernel_abi` argument, a
      module-level buffer, or a stack slot such a value was stored into) is target work that was
      accepted and then done on the scalar core anyway, with nothing in the buffer saying so.
      Arithmetic that reaches only induction variables, constants and pointer roots is ADDRESSING and
      is explicitly permitted -- a rule that counted arithmetic by opcode family would veto every
      legal descriptor setup. The same arithmetic in an H region is coverage, not a defect. Absent
      host IR is `incomplete` with a stated cause, never a pass. Adjudicated by
      `merlin.runtime.route_quality.host_compute`, gate `route_host_compute`"
  route_quality:
    purpose: "the QUALITY of an A or H claim, as distinct from the SHAPE of the partition above.
      `route_partition` says every region lands in exactly one route; this says the route it landed in
      is one the target's own facts support"
    # Which DERIVED field adjudicates which op family. This is data, not code, because it is a
    # statement about the ABI's family vocabulary that a reviewer has to be able to diff -- and
    # because the alternative (a table inside the checker) is exactly the shape of overfitting this
    # repo's cardinal rule forbids. A family absent from this map is `UNKNOWN`, never a pass:
    # adjudicating a refusal with a guessed rung manufactures a verdict nobody declared.
    #
    # `epilogue_stage` names a stage in the command-buffer ABI's epilogue vocabulary
    # (`merlin.runtime.commandbuffer.EPILOGUE_STAGES`). The refusal is contradicted when the target's
    # derived epilogue capability licenses that stage, or when the target's own declared readout
    # census applies it; it is confirmed only when a readout census exists and none applies it.
    #
    # `facet_field` names a field of the derived `ReadoutFacet` whose presence licenses the family,
    # with `facet_absent_field` carrying the facet's own reason when it is absent. `requires_derived`
    # lists the facet fields that must not be UNKNOWN before either verdict may be reached -- a
    # confirmation resting on an underived field reports a hardware refusal nobody established.
    host_refusal_evidence:
      quantize:
        epilogue_stage: acc_scale
        note: "narrowing a wide accumulator by a scale, a round and a clamp is what a readout path
          does; a target whose readout applies the accumulator scale has a datapath for it"
      minmax:
        epilogue_stage: relu
        note: "a rectifier is a clamp on the readout path, not a separate elementwise pass"
      pool:
        epilogue_stage: maxpool
        note: "pooling geometry carried in DEVICE fields of the convolution descriptor is a readout
          stage, not host work"
      elementwise:
        facet_field: operand_sum
        facet_absent_field: operand_sum_absent
        requires_derived: [accumulator_kind]
        note: "a residual add is an integer sum of two separately scaled tensors. A design whose LOAD
          multiplies and whose accumulator is addressable can sum them on the unit; one whose
          accumulator lives inside the datapath cannot. The rung is `readout_facet.operand_sum`, and
          it is UNKNOWN -- not a confirmation -- while `accumulator_kind` is underived"
  declined:
    purpose: "route D, stated in the command buffer itself so every consumer reads the same verdict"
    required: [reason]
    optional: [op]
    example: {op: "rmsnorm", reason: "no lowering for this operation on this target yet"}

# Optional manifest declarations for the WHOLE-MODEL build path (merlin.perf.whole_model_build). Both
# are OFF unless the package's own manifest.yaml declares them; a package that declares neither sees no
# change in how it is built, whatever the build's own flags are. Neither entry says HOW to use the
# mechanism it names -- what a package does with a region or a pass is the package's own compiler
# question, never the build's or the runner's to answer.
whole_model_optional:
  whole_model_regions:
    manifest_field: "whole_model_regions: true"
    purpose: "opt in to being offered a legal run of consecutive whole-model groups as ONE FUSED
      REGION capsule (a single lower_interface_to_target call over the merged bodies), in addition to
      being asked for each group alone. A declining package (this field absent, or the offered capsule
      refused/incomplete) is asked group by group exactly as if this did not exist."
    answer: "ONE kernel for the whole region. It must commit the BOUNDARY member's output (the last
      member's) under the capsule's own output name for it; an internal member's output is the
      kernel's own business -- bound to that member's program buffer when the reply declares it under
      its capsule name, never required. Its kernel arguments resolve like any reply's
      (arg_order_by_command_shape; a multi-command region states them as kernel_abi.kind
      whole_program)."
    graded: "at the region's BOUNDARY, against the independent oracle: every internal member is
      recomputed from the inputs the device held and the boundary is checked from them. Every member
      counts as package-answered while the region's kernel is linked; a region whose kernel is not
      linked puts every member back on the target's library."
    who_decides_legality: "merlin.llvmlower.region_legality.legal_regions, from the model's own
      dataflow, and the TARGET's own declaration of which ops its driver can hold as an internal
      member (its whole-model driver's FUSED_REGION_INTERNAL_OPS; a target that declares
      LINKS_FUSED_REGIONS false or nothing is never offered a region) -- never the package's; a
      package cannot request a specific window, only answer or decline the ones it is offered: from
      each member, a region grown one group at a time while the package keeps accepting it."
  whole_model_passes:
    manifest_field: "whole_model_passes: [name, ...]"
    purpose: "opt in to running the package's own named whole-model passes over the capsule's
      interface MLIR before it is split into groups. Each name must also be one of the package's own
      declared `commands` (schemas/manifest.schema.json); the transformed module is used for the rest
      of the build ONLY if it verifies as computing the same function as the untransformed one -- never
      trusted from the pass's own claim. A package that declares no passes here sees no change."
